name: Monthly tenant bills

# Two scheduled runs each month:
#   - the day before the 1st: a preview text to the owners with every tenant's amount
#   - the 1st: the tenant texts
# Scheduled runs only send when the repo variable SEND_ENABLED is "true"; otherwise they print
# a dry run in the log. To stop the tenant texts after seeing the preview, set SEND_ENABLED to false.
on:
  schedule:
    # owners' preview: the job only acts on the day before the 1st. Set at 12:00 UTC because GitHub often starts
    # scheduled runs several hours late; a later start could slip past midnight UTC and skip the preview.
    - cron: "0 12 28-31 * *"
    - cron: "0 18 1 * *"       # tenant texts, 18:00 UTC (11 AM Pacific)
  workflow_dispatch:
    inputs:
      send:
        description: "Actually send texts? (false = dry run, prints messages only)"
        type: boolean
        default: false
      mode:
        description: "What to send"
        type: choice
        options: [preview, tenants, all]
        default: preview
      ym:
        description: "Billing month YYYY-MM (blank = the cycle that last closed)"
        default: ""
      only:
        description: 'Only send to these, comma separated (blank = everyone). For a one-text test use: Owner'
        default: ""
      force:
        description: "Send again even to people who already got this month's text? (leave off normally)"
        type: boolean
        default: false

permissions:
  contents: write   # to save the record of which texts have been sent

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  bills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send bills
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TENANT_PHONES: ${{ secrets.TENANT_PHONES }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          SEND_FLAG=""
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs send only once SEND_ENABLED=true is set as a repo variable
            [ "${{ vars.SEND_ENABLED }}" = "true" ] && SEND_FLAG="--send"
            if [ "${{ github.event.schedule }}" = "0 18 1 * *" ]; then
              MODE="tenants"
            else
              # the preview cron fires on the 28th-31st; only the day before the 1st counts
              if [ "$(date -u -d tomorrow +%d)" != "01" ]; then
                echo "Not the day before the 1st; nothing to do."
                exit 0
              fi
              MODE="preview"
            fi
          else
            [ "${{ github.event.inputs.send }}" = "true" ] && SEND_FLAG="--send"
          fi
          YM_FLAG=""
          [ -n "${{ github.event.inputs.ym }}" ] && YM_FLAG="--ym ${{ github.event.inputs.ym }}"
          FORCE_FLAG=""
          [ "${{ github.event.inputs.force }}" = "true" ] && FORCE_FLAG="--force"
          ONLY_FLAG=()
          [ -n "${{ github.event.inputs.only }}" ] && ONLY_FLAG=(--only "${{ github.event.inputs.only }}")
          echo "mode: ${MODE:-all}  send: ${SEND_FLAG:-no (dry run)}"
          python -m billing.send_bills $SEND_FLAG $FORCE_FLAG --mode "${MODE:-all}" $YM_FLAG "${ONLY_FLAG[@]}"
      - name: Save the record of what was sent
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Record sent texts"
          git pull --rebase
          git push
