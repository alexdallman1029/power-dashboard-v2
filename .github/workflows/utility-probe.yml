name: Utility (SmartHub) probe

# Diagnostic only: prints the structure of SmartHub's responses (no tokens or readings).
on:
  workflow_dispatch:
    inputs:
      bill_date:
        description: "Bill date for the PDF layout check, as YYYY_M_D with no leading zeros"
        default: "2026_10_5"
      bill_file:
        description: "Optional: exact file name from the view-bill link, without .pdf (like 2026_10_5_1234567)"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 1 - Usage response shape
        env:
          SMARTHUB_USERNAME: ${{ secrets.SMARTHUB_USERNAME }}
          SMARTHUB_PASSWORD: ${{ secrets.SMARTHUB_PASSWORD }}
          SMARTHUB_ACCOUNT: ${{ secrets.SMARTHUB_ACCOUNT }}
          SMARTHUB_SERVICE_LOCATION: ${{ secrets.SMARTHUB_SERVICE_LOCATION }}
        run: python ingest/probe_smarthub.py
      - name: 2 - Billing history shape (PASTE THIS ONE)
        if: always()
        env:
          SMARTHUB_USERNAME: ${{ secrets.SMARTHUB_USERNAME }}
          SMARTHUB_PASSWORD: ${{ secrets.SMARTHUB_PASSWORD }}
          SMARTHUB_ACCOUNT: ${{ secrets.SMARTHUB_ACCOUNT }}
          SMARTHUB_SERVICE_LOCATION: ${{ secrets.SMARTHUB_SERVICE_LOCATION }}
        run: python -m ingest.probe_smarthub_billing
      - name: 3 - Bill PDF layout (digits masked)
        if: always()
        env:
          SMARTHUB_USERNAME: ${{ secrets.SMARTHUB_USERNAME }}
          SMARTHUB_PASSWORD: ${{ secrets.SMARTHUB_PASSWORD }}
          SMARTHUB_ACCOUNT: ${{ secrets.SMARTHUB_ACCOUNT }}
        run: |
          pip install pypdf
          python -m ingest.probe_smarthub_pdf "${{ github.event.inputs.bill_date || '2026_10_5' }}" "${{ github.event.inputs.bill_file }}"
