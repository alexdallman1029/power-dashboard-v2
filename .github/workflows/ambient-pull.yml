name: Ambient Weather daily pull

on:
  schedule:
    - cron: "45 10 * * *"   # daily, after the other data pulls
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull the newest readings
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APPLICATION_KEY: ${{ secrets.AMBIENT_APPLICATION_KEY }}
        run: python -m ingest.pull_ambient 3
      - name: Commit updated weather data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.sqlite
          git diff --cached --quiet || git commit -m "Update weather data"
          git pull --rebase
          git push
