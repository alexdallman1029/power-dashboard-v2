name: Climate indices pull

# ENSO (ONI) and the PDO are monthly NOAA numbers, so a weekly refresh is plenty.
on:
  schedule:
    - cron: "20 12 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull ENSO and PDO from NOAA
        run: python -m ingest.pull_climate
      - name: Commit updated climate data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.sqlite
          git diff --cached --quiet || git commit -m "Update climate indices (ENSO, PDO)"
          git pull --rebase
          git push
