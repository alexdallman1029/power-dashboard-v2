name: Utility (SmartHub) pull

# Manual for now. Once the numbers match your bills, a monthly schedule can be added.
on:
  workflow_dispatch:
    inputs:
      months_back:
        description: "Months of utility history to pull"
        default: "24"

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull monthly usage from SmartHub
        env:
          SMARTHUB_USERNAME: ${{ secrets.SMARTHUB_USERNAME }}
          SMARTHUB_PASSWORD: ${{ secrets.SMARTHUB_PASSWORD }}
          SMARTHUB_ACCOUNT: ${{ secrets.SMARTHUB_ACCOUNT }}
          SMARTHUB_SERVICE_LOCATION: ${{ secrets.SMARTHUB_SERVICE_LOCATION }}
        run: python -m ingest.pull_smarthub ${{ github.event.inputs.months_back || '24' }}
      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/energy.sqlite
          git diff --cached --quiet || git commit -m "Update utility monthly usage"
          git pull --rebase
          git push
