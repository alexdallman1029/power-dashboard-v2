name: Daily Emporia pull

on:
  schedule:
    - cron: "0 10 * * *"   # same as the Render cron: 10:00 UTC (3 AM Pacific)
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of history to pull (use ~300 once to backfill the gap)"
        default: "7"

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull from Emporia
        env:
          EMPORIA_USERNAME: ${{ secrets.EMPORIA_USERNAME }}
          EMPORIA_PASSWORD: ${{ secrets.EMPORIA_PASSWORD }}
        run: python -m ingest.pull_emporia ${{ github.event.inputs.days_back || '7' }}
      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/energy.sqlite
          git diff --cached --quiet || git commit -m "Update energy data"
          git pull --rebase
          git push
